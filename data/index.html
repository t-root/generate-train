<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Data</title>
  <style>
    * { box-sizing: border-box; border-radius: 0; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #fff;
      background: #000;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    .sub { font-size: 0.875rem; opacity: 0.85; }
    main { padding: 1rem 1.5rem; max-width: 1200px; margin: 0 auto; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .stat, .filters, .card, .modal-panel {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      padding: 0.75rem 1rem;
    }
    .stat b { display: block; font-size: 1.5rem; }
    .stat span { font-size: 0.7rem; text-transform: uppercase; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-bottom: 1rem;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    input, select, textarea {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      padding: 0.5rem 0.6rem;
      min-width: 140px;
      font: inherit;
    }
    textarea { min-width: 100%; min-height: 80px; resize: vertical; }
    button {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      padding: 0.55rem 1rem;
      cursor: pointer;
      font-weight: 600;
      font: inherit;
    }
    button:hover { background: #222; }
    button.secondary:hover,
    button.danger:hover { background: #222; }
    button.danger { border: 1px solid #fff; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .meta { font-size: 0.875rem; margin-bottom: 0.75rem; opacity: 0.9; }
    .card { margin-bottom: 0.75rem; }
    .card-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .badge {
      background: #000;
      color: #fff;
      padding: 0.15rem 0.45rem;
      border: 1px solid #fff;
    }
    .field { margin-top: 0.5rem; }
    .field strong { font-size: 0.75rem; text-transform: uppercase; }
    .field p { margin: 0.25rem 0 0; white-space: pre-wrap; line-height: 1.45; }
    .expandable { cursor: pointer; user-select: none; }
    .expandable-header { display: flex; align-items: center; gap: 0.5rem; }
    .expand-icon { display: inline-block; width: 0.75rem; text-align: center; transition: transform 0.2s; }
    .expandable.expanded .expand-icon { transform: rotate(90deg); }
    .expandable-content { display: none; margin-top: 0.5rem; }
    .expandable.expanded .expandable-content { display: block; }
    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .card-actions button { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .empty { text-align: center; padding: 2rem; opacity: 0.8; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal.open { display: flex; }
    .modal-panel {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-panel h2 { margin: 0 0 1rem; font-size: 1.1rem; }
    .form-row { margin-bottom: 0.75rem; }
    .form-row label { width: 100%; }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .hint {
      font-size: 0.75rem;
      margin-top: 0.25rem;
      opacity: 0.8;
    }
    .toast {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      padding: 0.75rem 1rem;
      display: none;
      z-index: 200;
      max-width: 320px;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>QA Data</h1>
    <p class="sub">ChromaDB — xem, thêm, sửa, xóa (sửa selected sẽ build lại vector)</p>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <button type="button" id="addBtn">+ Thêm mẫu</button>
    </div>
    <div class="filters">
      <label>Status
        <select id="status">
          <option value="">All</option>
          <option value="selected">selected</option>
          <option value="duplicate_context">duplicate_context</option>
          <option value="invalid_json">invalid_json</option>
          <option value="bad_rule">bad_rule</option>
        </select>
      </label>
      <label>Keyword
        <input id="keyword" type="text" placeholder="Search document..." />
      </label>
      <label>Sample ID
        <input id="sampleId" type="text" placeholder="e.g. 12" />
      </label>
      <label>Limit
        <input id="limit" type="number" value="30" min="1" max="500" />
      </label>
      <label>Offset
        <input id="offset" type="number" value="0" min="0" />
      </label>
      <button type="button" id="applyBtn">Lọc</button>
      <button type="button" class="danger" id="purgeStatusBtn" disabled title="Chọn một status (không phải All)">Xóa all theo status</button>
    </div>
    <p class="meta" id="resultMeta">Loading...</p>
    <div id="list"></div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-panel">
      <h2 id="modalTitle">Thêm mẫu</h2>
      <form id="sampleForm">
        <input type="hidden" id="formId" />
        <div class="form-row">
          <label>Status
            <select id="formStatus" required>
              <option value="selected">selected</option>
              <option value="duplicate_context">duplicate_context</option>
              <option value="invalid_json">invalid_json</option>
              <option value="bad_rule">bad_rule</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <label>User
            <textarea id="formUser"></textarea>
          </label>
        </div>
        <div class="form-row">
          <label>Assistant
            <textarea id="formAssistant"></textarea>
          </label>
        </div>
        <div class="form-row">
          <label>Reason (optional)
            <input id="formReason" type="text" />
          </label>
        </div>
        <p class="hint" id="vectorHint">Status <code>selected</code> + có user/assistant → tự build lại embedding khi lưu.</p>
        <div class="modal-actions">
          <button type="submit" id="saveBtn">Lưu</button>
          <button type="button" class="secondary" id="cancelBtn">Hủy</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const modal = document.getElementById("modal");
    const form = document.getElementById("sampleForm");
    let editMode = false;
    let summaryData = {};

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3500);
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function statusCount(status) {
      const map = {
        selected: summaryData.selected,
        duplicate_context: summaryData.duplicate_context,
        invalid_json: summaryData.invalid_json,
        bad_rule: summaryData.bad_rule,
      };
      return map[status] ?? 0;
    }

    function updatePurgeButton() {
      const status = document.getElementById("status").value;
      const btn = document.getElementById("purgeStatusBtn");
      const n = status ? statusCount(status) : 0;
      btn.disabled = !status || n === 0;
      btn.title = status
        ? `Xóa toàn bộ ${n} mẫu status «${status}»`
        : "Chọn một status (không phải All)";
    }

    async function loadSummary() {
      const res = await fetch("/api/summary");
      const data = await res.json();
      summaryData = data;
      const el = document.getElementById("stats");
      const items = [
        ["total", data.total],
        ["selected", data.selected],
        ["duplicate", data.duplicate_context],
        ["invalid_json", data.invalid_json],
        ["bad_rule", data.bad_rule],
      ];
      el.innerHTML = items.map(([k, v]) =>
        `<div class="stat"><b>${v}</b><span>${k}</span></div>`
      ).join("");
      updatePurgeButton();
    }

    function queryParams() {
      const status = document.getElementById("status").value;
      const keyword = document.getElementById("keyword").value.trim();
      const sampleId = document.getElementById("sampleId").value.trim();
      const limit = document.getElementById("limit").value;
      const offset = document.getElementById("offset").value;
      const params = new URLSearchParams();
      if (status) params.set("status", status);
      if (keyword) params.set("keyword", keyword);
      if (sampleId) params.set("id", sampleId);
      params.set("limit", limit);
      params.set("offset", offset);
      return params;
    }

    async function loadSamples() {
      const res = await fetch("/api/samples?" + queryParams().toString());
      const data = await res.json();
      document.getElementById("resultMeta").textContent =
        `Hiển thị ${data.items.length} / ${data.total_matched} (offset ${data.offset})`;

      const list = document.getElementById("list");
      if (!data.items.length) {
        list.innerHTML = '<div class="empty">Không có mẫu nào.</div>';
        return;
      }
      list.innerHTML = data.items.map((row) => `
        <article class="card" data-id="${escapeHtml(row.id)}">
          <div class="card-head">
            <span class="badge">#${escapeHtml(row.id)}</span>
            <span class="badge">${escapeHtml(row.status || "—")}</span>
            <span>${escapeHtml(row.created_at || "")}</span>
            ${row.reason ? `<span>reason: ${escapeHtml(row.reason)}</span>` : ""}
            ${row.nearest_selected_id ? `<span>nearest: #${escapeHtml(row.nearest_selected_id)}</span>` : ""}
          </div>
          <div class="field"><strong>User</strong><p>${escapeHtml(row.user)}</p></div>
          <div class="field"><strong>Assistant</strong><p>${escapeHtml(row.assistant)}</p></div>
          ${row.raw_response ? `
          <div class="field expandable" onclick="this.classList.toggle('expanded')">
            <strong class="expandable-header"><span class="expand-icon">▶</span> Raw Response</strong>
            <div class="expandable-content">
              <p>${escapeHtml(row.raw_response)}</p>
            </div>
          </div>
          ` : ""}
          <div class="card-actions">
            <button type="button" class="secondary edit-btn" data-id="${escapeHtml(row.id)}">Sửa</button>
            <button type="button" class="danger del-btn" data-id="${escapeHtml(row.id)}">Xóa</button>
          </div>
        </article>
      `).join("");

      list.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => openEdit(btn.dataset.id, data.items));
      });
      list.querySelectorAll(".del-btn").forEach((btn) => {
        btn.addEventListener("click", () => deleteSample(btn.dataset.id));
      });
    }

    function openAdd() {
      editMode = false;
      document.getElementById("modalTitle").textContent = "Thêm mẫu";
      document.getElementById("formId").value = "";
      document.getElementById("formStatus").value = "selected";
      document.getElementById("formUser").value = "";
      document.getElementById("formAssistant").value = "";
      document.getElementById("formReason").value = "";
      modal.classList.add("open");
    }

    function openEdit(id, items) {
      const row = items.find((r) => String(r.id) === String(id));
      if (!row) return;
      editMode = true;
      document.getElementById("modalTitle").textContent = `Sửa #${id}`;
      document.getElementById("formId").value = id;
      document.getElementById("formStatus").value = row.status || "selected";
      document.getElementById("formUser").value = row.user || "";
      document.getElementById("formAssistant").value = row.assistant || "";
      document.getElementById("formReason").value = row.reason || "";
      modal.classList.add("open");
    }

    function closeModal() {
      modal.classList.remove("open");
    }

    async function deleteSample(id) {
      if (!confirm(`Xóa mẫu #${id}?`)) return;
      const res = await fetch(`/api/samples/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        toast(err.error || "Xóa thất bại");
        return;
      }
      toast(`Đã xóa #${id}`);
      await refresh();
    }

    async function deleteAllByStatus() {
      const status = document.getElementById("status").value;
      if (!status) {
        toast("Chọn một status trước (không dùng All)");
        return;
      }
      const n = statusCount(status);
      if (!n) {
        toast(`Không có mẫu status «${status}»`);
        return;
      }
      const msg =
        `Xóa TOÀN BỘ ${n} mẫu có status «${status}»?\n\n` +
        "Hành động không hoàn tác.";
      if (!confirm(msg)) return;

      const res = await fetch(
        `/api/samples/by-status/${encodeURIComponent(status)}`,
        { method: "DELETE" }
      );
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        toast(data.error || "Xóa theo status thất bại");
        return;
      }
      toast(`Đã xóa ${data.deleted} mẫu (${status})`);
      document.getElementById("offset").value = "0";
      await refresh();
    }

    async function saveSample(e) {
      e.preventDefault();
      const id = document.getElementById("formId").value;
      const body = {
        user: document.getElementById("formUser").value,
        assistant: document.getElementById("formAssistant").value,
        status: document.getElementById("formStatus").value,
        reason: document.getElementById("formReason").value,
      };

      let res;
      if (editMode && id) {
        res = await fetch(`/api/samples/${encodeURIComponent(id)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      } else {
        res = await fetch("/api/samples", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        toast(data.error || "Lưu thất bại");
        return;
      }
      const msg = editMode
        ? `Đã sửa #${data.id}` + (body.status === "selected" ? " (vector rebuilt)" : "")
        : `Đã thêm #${data.id}`;
      toast(msg);
      closeModal();
      await refresh();
    }

    async function refresh() {
      await loadSummary();
      await loadSamples();
    }

    document.getElementById("applyBtn").addEventListener("click", refresh);
    document.getElementById("purgeStatusBtn").addEventListener("click", deleteAllByStatus);
    document.getElementById("status").addEventListener("change", updatePurgeButton);
    document.getElementById("addBtn").addEventListener("click", openAdd);
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    form.addEventListener("submit", saveSample);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    refresh();
  </script>
</body>
</html>
